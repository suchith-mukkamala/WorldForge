name: Build and test

on:
  push:
    branches: [main]
  pull_request:

# Avoid running expensive obsolete PR checks on every successive commit.
concurrency:
  group: build-and-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - run: npm run test:release-smoke
