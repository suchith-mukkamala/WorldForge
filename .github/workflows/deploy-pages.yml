name: Deploy WorldForge to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build for repository Pages URL
        run: npm run build -- --base=/WorldForge/
      - name: Verify compiled app and Pages asset paths
        run: |
          test -f dist/index.html
          grep -q '/WorldForge/assets/' dist/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Wait for the Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          for attempt in {1..6}; do
            if gh api --silent "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID"; then
              # Let the Actions results service index the uploaded artifact.
              sleep 5
              exit 0
            fi
            sleep 2
          done
          echo '::error::The Pages artifact is still unavailable.'
          exit 1
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
