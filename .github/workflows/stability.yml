name: WorldForge long-run stability

on:
  schedule:
    - cron: '17 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: long-run-stability
  cancel-in-progress: false

jobs:
  ecology-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run test:long-simulation
      - run: npm run test:population-sweep
      - run: npm run test:daily-life-sweep
